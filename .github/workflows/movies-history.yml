name: Build movie history

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Both movie workflows share one group so they never run (or commit) at the same time.
concurrency:
  group: movies-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Add older movies with the leftover OMDb requests
        env:
          TMDB_Key: ${{ secrets.TMDB_Key }}
          OMDB_Key: ${{ secrets.OMDB_Key }}
        run: python movies.py history

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update movie history"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((RANDOM % 6 + 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
